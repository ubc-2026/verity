name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: npm ci
      - run: python -m pip install -r analysis/requirements.txt requests
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:worker
      - run: python -m pytest -q
        working-directory: analysis
