name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: npm ci
      - run: python -m pip install -r analysis/requirements.txt requests
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:worker
      - run: python -m pytest -q
        working-directory: analysis
      # audit/ and portal/ are separate packages with their own lockfiles and tests.
      - run: npm ci
        working-directory: audit
      - run: npm test
        working-directory: audit
      - run: npm run typecheck
        working-directory: audit
      - run: npm ci
        working-directory: portal
      - run: npm test
        working-directory: portal
      - run: npm run typecheck
        working-directory: portal
      # The published page is site/dist/index.html; it must be the build of site/src.
      - run: sh site/build.sh && git diff --ignore-cr-at-eol --exit-code site/dist
