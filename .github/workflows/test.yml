name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: npm ci
      - run: python -m pip install -r analysis/requirements.txt requests
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:worker
      - run: python -m pytest -q
        working-directory: analysis
      # audit/ and portal/ are separate packages with their own lockfiles and tests.
      - run: npm ci
        working-directory: audit
      - run: npm test
        working-directory: audit
      - run: npm run typecheck
        working-directory: audit
      - run: npm ci
        working-directory: portal
      - run: npm test
        working-directory: portal
      - run: npm run typecheck
        working-directory: portal
      # The published page is site/dist/index.html; it must be the build of site/src.
      - run: sh site/build.sh && git diff --ignore-cr-at-eol --exit-code site/dist
